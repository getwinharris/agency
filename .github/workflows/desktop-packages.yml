name: Desktop packages

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-packages.yml'
      - 'core/**'
      - 'gui/**'
      - '!gui/apps/android/**'
      - '!gui/apps/www/**'
      - 'skills/**'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-packages.yml'
      - 'core/**'
      - 'gui/**'
      - '!gui/apps/android/**'
      - '!gui/apps/www/**'
      - 'skills/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            command: dist
          - platform: windows-x64
            runner: windows-2025
            command: dist:win
          - platform: linux-x64
            runner: ubuntu-24.04
            command: dist:linux
    defaults:
      run:
        working-directory: gui
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: gui/.nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: gui/package.json
      - name: Install Linux packaging prerequisites
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libfuse2t64
      - name: Set Rust toolchain
        run: rustup default stable
      - name: Install dependencies
        if: matrix.platform != 'windows-x64'
        run: pnpm install --frozen-lockfile
      - name: Install Windows dependencies
        if: matrix.platform == 'windows-x64'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Electron for native package verification
        run: |
          node apps/desktop/node_modules/electron/install.js
          node -e "require('node:fs').accessSync(require('./apps/desktop/node_modules/electron'))"
      - name: Package
        if: matrix.platform != 'macos-arm64'
        env:
          DESKTOP_PACKAGE_COMMAND: ${{ matrix.command }}
        run: pnpm --dir apps/desktop run "$DESKTOP_PACKAGE_COMMAND"
      - name: Package macOS with a local test signature
        if: matrix.platform == 'macos-arm64'
        env:
          # electron-builder's PR gate also covers local ad-hoc signatures.
          CSC_FOR_PULL_REQUEST: 'true'
        run: pnpm --dir apps/desktop run dist --ad-hoc
      - name: Smoke test packaged app
        if: matrix.platform != 'linux-x64'
        run: pnpm --dir apps/desktop run smoke:packaged
      - name: Smoke test Linux packaged app
        if: matrix.platform == 'linux-x64'
        run: xvfb-run -a pnpm --dir apps/desktop run smoke:packaged
      - name: Verify macOS disk image
        if: matrix.platform == 'macos-arm64'
        run: hdiutil verify apps/desktop/release.noindex/bapx-agents-*-arm64.dmg
      - name: Verify macOS CLI aliases
        if: matrix.platform == 'macos-arm64'
        run: |
          cli='apps/desktop/release.noindex/mac-arm64/bapX Agents.app/Contents/Resources/app.asar.unpacked/node_modules/bb-app/host-daemon/dist'
          primary="$("$cli/bapx-cli" --version)"
          legacy="$("$cli/room-cli" --version)"
          [[ -n "$primary" && "$primary" == "$legacy" ]]
      - name: Verify Windows installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $output = 'apps/desktop/release.noindex'
          $installer = Get-Item "$output/bapx-agents-v$version-x64.exe"
          $app = Get-Item "$output/win-unpacked/bapX Agents.exe"
          $versionPattern = '^{0}(?:\.0)?$' -f [Regex]::Escape($version)
          foreach ($path in @($installer, $app)) {
            if ($path.VersionInfo.ProductName -cne 'bapX Agents' -or
                $path.VersionInfo.ProductVersion -notmatch $versionPattern) {
              throw "Unexpected product metadata in $($path.Name)"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path.FullName
            if ($signature.Status -notin @('NotSigned', 'Valid')) {
              throw "Invalid Authenticode status $($signature.Status) for $($path.Name)"
            }
            Write-Host "$($path.Name): Authenticode $($signature.Status)"
          }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/bapx-agents/bapX Agents.exe'
          if (Test-Path -LiteralPath $installed) { throw 'Expected a clean runner' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Silent NSIS install timed out'
          }
          if ($process.ExitCode -ne 0) { throw "NSIS returned $($process.ExitCode)" }
          if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath $app.FullName).Hash) {
            throw 'The installed executable differs from the packaged executable'
          }
          $cliDir = Join-Path (Split-Path $installed) 'resources/app.asar.unpacked/node_modules/bb-app/host-daemon/dist'
          foreach ($extension in @('cmd', 'ps1')) {
            $primary = & (Join-Path $cliDir "bapx-cli.$extension") --version
            if ($LASTEXITCODE -ne 0 -or -not $primary) { throw "bapx-cli.$extension failed" }
            $legacy = & (Join-Path $cliDir "room-cli.$extension") --version
            if ($LASTEXITCODE -ne 0 -or "$primary" -cne "$legacy") {
              throw "The $extension CLI aliases report different versions"
            }
          }
      - name: Verify Linux AppImage
        if: matrix.platform == 'linux-x64'
        run: |
          images=(apps/desktop/release.noindex/bapx-agents-*-x86_64.AppImage)
          [[ ${#images[@]} -eq 1 && -f ${images[0]} ]]
          image="$(realpath "${images[0]}")"
          file "$image" | grep -F 'x86-64'
          unpack="$(mktemp -d)"
          trap 'rm -rf -- "$unpack"' EXIT
          cd "$unpack"
          "$image" --appimage-extract >/dev/null
          test -x squashfs-root/bapx-agents
          grep -F 'Name=bapX Agents' squashfs-root/*.desktop
          cli=squashfs-root/resources/app.asar.unpacked/node_modules/bb-app/host-daemon/dist
          primary="$("$cli/bapx-cli" --version)"
          legacy="$("$cli/room-cli" --version)"
          [[ -n "$primary" && "$primary" == "$legacy" ]]
          "$cli/bapx-cli" thread --help | grep -F 'Usage: bapx-cli thread'
      - name: Prepare checksums for verified packages
        env:
          DESKTOP_PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'JS'
          import { createReadStream } from "node:fs";
          import { readFile, writeFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          const desktop = "apps/desktop";
          const version = JSON.parse(await readFile(`${desktop}/package.json`, "utf8")).version;
          const artifacts = {
            "macos-arm64": ["arm64.dmg", "arm64.zip"],
            "windows-x64": ["x64.exe"],
            "linux-x64": ["x86_64.AppImage"],
          }[process.env.DESKTOP_PLATFORM];
          const directory = `${desktop}/release.noindex`;
          const lines = [];
          for (const artifact of artifacts) {
            const name = `bapx-agents-v${version}-${artifact}`;
            const hash = createHash("sha256");
            for await (const bytes of createReadStream(`${directory}/${name}`)) hash.update(bytes);
            lines.push(`${hash.digest("hex")}  ${name}`);
          }
          await writeFile(`${directory}/SHA256SUMS.txt`, lines.join("\n") + "\n");
          const revision = process.env.GITHUB_SHA;
          if (!/^[a-f0-9]{40}$/.test(revision ?? "")) throw new Error("Missing exact package source revision");
          const candidate = {
            product: "bapX Agents",
            version,
            revision,
            platform: process.env.DESKTOP_PLATFORM,
            sourceRef: process.env.GITHUB_REF,
            sourceEvent: process.env.GITHUB_EVENT_NAME,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            published: false,
            distributionVerified: false,
          };
          await writeFile(`${directory}/CANDIDATE.json`, JSON.stringify(candidate, null, 2) + "\n");
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bapx-agents-${{ matrix.platform }}
          path: |
            gui/apps/desktop/release.noindex/bapx-agents-*.dmg
            gui/apps/desktop/release.noindex/bapx-agents-*.zip
            gui/apps/desktop/release.noindex/bapx-agents-*.exe
            gui/apps/desktop/release.noindex/bapx-agents-*.AppImage
            gui/apps/desktop/release.noindex/SHA256SUMS.txt
            gui/apps/desktop/release.noindex/CANDIDATE.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
