name: Deploy app sample

on:
  workflow_run:
    workflows: [Public web]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: app-sample-production
  queue: max

jobs:
  deploy:
    if: >-
      github.repository == 'getwinharris/agency' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/web.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: app-sample-production
      url: https://dynamic-check.app.bapx.in
    steps:
      - name: Request the verified sample deployment
        shell: bash
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [[ ! $SHA =~ ^[0-9a-f]{40}$ ||
                ! $RUN_ID =~ ^[1-9][0-9]*$ ||
                ! $ATTEMPT =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid Public web release identity.' >&2
            exit 1
          fi
          if [[ ! $VPS_SSH_HOST =~ ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$ ||
                -z $VPS_SSH_KNOWN_HOSTS || -z $VPS_SSH_PRIVATE_KEY ]]; then
            echo 'Missing or invalid sample deployment SSH configuration.' >&2
            exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/agency-sample-ssh.XXXXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS

          ssh -F /dev/null -nT -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            -- "bapx-sample-deploy@$VPS_SSH_HOST" \
            "deploy-sample $SHA $RUN_ID $ATTEMPT"
