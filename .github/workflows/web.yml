name: Public web

on:
  pull_request:
    paths:
      - 'core/**'
      - 'gui/README.md'
      - 'gui/apps/desktop/README.md'
      - 'gui/apps/www/**'
      - 'gui/docs/configuration.md'
      - 'gui/docs/release-notes.md'
      - 'gui/package.json'
      - 'gui/patches/**'
      - 'gui/pnpm-lock.yaml'
      - 'gui/pnpm-workspace.yaml'
      - 'gui/.nvmrc'
      - 'deploy/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/core.yml'
      - '.github/workflows/web.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    if: github.event_name == 'push'
    uses: ./.github/workflows/app.yml
  core:
    if: github.event_name == 'push'
    uses: ./.github/workflows/core.yml
  web:
    needs: [app, core]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (needs.app.result == 'success' && needs.core.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          docker build --file deploy/web.Dockerfile --tag agency-web:check \
            --build-arg "BAPX_WEB_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      - name: Smoke test
        run: |
          umask 077
          admin_password="$(mktemp)"
          openssl rand -hex 32 > "$admin_password"
          sudo chown 10001:10001 "$admin_password"
          sudo chmod 0400 "$admin_password"
          docker run --detach --rm --name agency-web --publish 127.0.0.1:8080:8080 \
            --env BAPX_ADMIN_PASSWORD_FILE=/run/secrets/bapx-admin-password \
            --mount "type=bind,src=$admin_password,dst=/run/secrets/bapx-admin-password,readonly" agency-web:check
          trap 'docker logs agency-web; docker stop agency-web' EXIT
          for host in bapx.in www.bapx.in docs.bapx.in mediahub.bapx.in admin.bapx.in; do
            curl --retry 10 --retry-connrefused --fail --silent --show-error \
              -H "Host: $host" http://127.0.0.1:8080/healthz |
              jq -e --arg sha "$GITHUB_SHA" '.ready == true and .service == "bapx-web" and .revision == $sha'
          done
          for host in bapx.in www.bapx.in; do
            curl --fail --silent --show-error -H "Host: $host" http://127.0.0.1:8080/ \
              --output "$RUNNER_TEMP/$host-home.html"
            grep -Fq '<h1 id="headline">' "$RUNNER_TEMP/$host-home.html" || {
              printf 'Expected landing heading is missing for %s.\n' "$host" >&2
              exit 1
            }
          done
          curl --fail --silent --show-error -H 'Host: docs.bapx.in' http://127.0.0.1:8080/ --output "$RUNNER_TEMP/docs-home.html"
          grep -F 'bapX Agents documentation' "$RUNNER_TEMP/docs-home.html"
          grep -F '<a href="/release-notes/">release changelog</a>' "$RUNNER_TEMP/docs-home.html"
          for slug in build-from-source desktop-packaging private-core project-skills release-notes; do
            curl --fail --silent --show-error -H 'Host: docs.bapx.in' "http://127.0.0.1:8080/$slug/" --output "$RUNNER_TEMP/docs-$slug.html"
          done
          grep -F 'id="1-install-tools-and-build"' "$RUNNER_TEMP/docs-private-core.html"
          grep -F '<pre tabindex="0"><code' "$RUNNER_TEMP/docs-private-core.html"
          grep -F '<table>' "$RUNNER_TEMP/docs-desktop-packaging.html"
          grep -F 'id="install-an-agency-skill-in-native-agents"' "$RUNNER_TEMP/docs-project-skills.html"
          grep -F '>Verified web deployments</h2>' "$RUNNER_TEMP/docs-release-notes.html"
          grep -F '>Pending</h2>' "$RUNNER_TEMP/docs-release-notes.html"
          grep -E '>Served SHA <code>[a-f0-9]{40}</code></li>' "$RUNNER_TEMP/docs-release-notes.html"
          curl --fail --silent --show-error -H 'Host: docs.bapx.in' http://127.0.0.1:8080/docs.css --output "$RUNNER_TEMP/docs.css"
          test -s "$RUNNER_TEMP/docs.css"
          curl --fail --silent -H 'Host: mediahub.bapx.in' http://127.0.0.1:8080/clients/nebo-lifestyle-clinic/ | grep -iF 'Nebo Lifestyle Clinic'
          curl --fail --silent -H 'Host: admin.bapx.in' http://127.0.0.1:8080/ | grep -F '<h1 id="login-title">Sign in</h1>'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Host: admin.bapx.in' http://127.0.0.1:8080/api/admin/session)" = 401
          curl --fail --silent --location -H 'Host: bapx.in' http://127.0.0.1:8080/favicon.svg --output "$RUNNER_TEMP/bapx-favicon.svg"
          cmp gui/apps/www/public/brand/favicon.svg "$RUNNER_TEMP/bapx-favicon.svg"
          for icon in favicon.ico favicon-96x96.png; do
            curl --fail --silent -H 'Host: admin.bapx.in' "http://127.0.0.1:8080/$icon" --output "$RUNNER_TEMP/$icon"
            cmp "gui/apps/www/public/brand/$icon" "$RUNNER_TEMP/$icon"
          done
          curl --fail --silent -H 'Host: admin.bapx.in' http://127.0.0.1:8080/brand/bapx-logo-main.svg --output "$RUNNER_TEMP/bapx-logo-main.svg"
          cmp gui/apps/www/public/brand/bapx-logo-main.svg "$RUNNER_TEMP/bapx-logo-main.svg"
          BAPX_WEB_IMAGE=agency-web:check docker compose -f deploy/compose.web.yml config --quiet
      - name: Publish main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${REPO,,}-web"
          docker tag agency-web:check "$image:$GITHUB_SHA"
          log="$RUNNER_TEMP/agency-web-push.log"
          docker push "$image:$GITHUB_SHA" | tee "$log"
          digest=$(sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}).*/\1/p' "$log")
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          release="$RUNNER_TEMP/agency-web-release"
          mkdir "$release"
          cp deploy/compose.web.yml "$release/compose.web.yml"
          compose_hash=$(sha256sum "$release/compose.web.yml" | cut -d' ' -f1)
          jq -n --arg sha "$GITHUB_SHA" --arg image "$image@$digest" --arg composeHash "$compose_hash" \
            '{sha: $sha, image: $image, composeSha256: $composeHash}' > "$release/release.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: agency-web-release
          path: ${{ runner.temp }}/agency-web-release
          if-no-files-found: error
          overwrite: true
          retention-days: 14
