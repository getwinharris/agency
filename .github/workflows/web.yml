name: Public web

on:
  pull_request:
    paths:
      - 'core/**'
      - 'gui/README.md'
      - 'gui/apps/desktop/README.md'
      - 'gui/apps/desktop/package.json'
      - 'gui/apps/www/**'
      - 'gui/docs/configuration.md'
      - 'gui/docs/release-notes.md'
      - 'gui/package.json'
      - 'gui/patches/**'
      - 'gui/pnpm-lock.yaml'
      - 'gui/pnpm-workspace.yaml'
      - 'gui/.nvmrc'
      - 'deploy/**'
      - 'starters/app-admin/**'
      - 'map.mmd'
      - 'docs/project-index.json'
      - 'gui/apps/cli/bin/bapx-cli'
      - 'gui/apps/cli/scripts/repository-cli.mjs'
      - 'gui/apps/cli/scripts/repository-inventory.mjs'
      - 'gui/apps/cli/scripts/repository-web-verification.mjs'
      - '.github/workflows/source-inventory.yml'
      - '.github/workflows/app.yml'
      - '.github/workflows/core.yml'
      - '.github/workflows/desktop-packages.yml'
      - '.github/workflows/web.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && 'public-web-production' || format('public-web-pr-{0}', github.run_id) }}
  queue: max

permissions:
  contents: read

jobs:
  app:
    if: github.event_name == 'push'
    uses: ./.github/workflows/app.yml
  core:
    if: github.event_name == 'push'
    uses: ./.github/workflows/core.yml
  web:
    needs: [app, core]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (needs.app.result == 'success' && needs.core.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: gui/.nvmrc
      - name: Check the architecture map and project index
        run: ./gui/apps/cli/bin/bapx-cli repo inventory check
      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy-web.sh
          bash -n deploy/deploy-web-ssh.sh
          bash -n deploy/publish-site.sh
          sudo visudo -cf deploy/web-deploy.sudoers
      - name: Build
        run: |
          docker build --file deploy/web.Dockerfile --tag agency-web:check \
            --build-arg "BAPX_WEB_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      - name: Smoke test
        run: |
          umask 077
          admin_password="$(mktemp)"
          openssl rand -hex 32 > "$admin_password"
          sudo chown 10001:10001 "$admin_password"
          sudo chmod 0400 "$admin_password"
          docker run --detach --rm --name agency-web --publish 127.0.0.1:8080:8080 \
            --env BAPX_ADMIN_PASSWORD_FILE=/run/secrets/bapx-admin-password \
            --mount "type=bind,src=$admin_password,dst=/run/secrets/bapx-admin-password,readonly" agency-web:check
          trap 'docker logs agency-web; docker stop agency-web' EXIT
          ./gui/apps/cli/bin/bapx-cli repo verify web --revision "$GITHUB_SHA" --origin http://127.0.0.1:8080
          BAPX_WEB_IMAGE=agency-web:check docker compose -f deploy/compose.web.yml config --quiet
      - name: Publish main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${REPO,,}-web"
          docker tag agency-web:check "$image:$GITHUB_SHA"
          log="$RUNNER_TEMP/agency-web-push.log"
          docker push "$image:$GITHUB_SHA" | tee "$log"
          digest=$(sed -nE 's/^.*digest: (sha256:[a-f0-9]{64}).*/\1/p' "$log")
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          release="$RUNNER_TEMP/agency-web-release"
          mkdir "$release"
          cp deploy/compose.web.yml "$release/compose.web.yml"
          compose_hash=$(sha256sum "$release/compose.web.yml" | cut -d' ' -f1)
          jq -n --arg sha "$GITHUB_SHA" --arg image "$image@$digest" --arg composeHash "$compose_hash" \
            '{sha: $sha, image: $image, composeSha256: $composeHash}' > "$release/release.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: agency-web-release
          path: ${{ runner.temp }}/agency-web-release
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  deploy:
    needs: web
    if: github.repository == 'getwinharris/agency' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: public-web-production
      url: https://bapx.in
    permissions: {}
    steps:
      - name: Deploy verified web image on Hostinger
        shell: bash
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [[ ! $GITHUB_SHA =~ ^[0-9a-f]{40}$ ||
                ! $GITHUB_RUN_ID =~ ^[1-9][0-9]*$ ||
                ! $GITHUB_RUN_ATTEMPT =~ ^[1-9][0-9]*$ ]]; then
            echo 'Invalid GitHub release identity.' >&2
            exit 1
          fi
          if [[ ! $VPS_SSH_HOST =~ ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$ ||
                -z $VPS_SSH_KNOWN_HOSTS || -z $VPS_SSH_PRIVATE_KEY ]]; then
            echo 'Missing or invalid production SSH configuration.' >&2
            exit 1
          fi

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/agency-web-ssh.XXXXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS

          ssh -F /dev/null -nT -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            -- "bapx-web-deploy@$VPS_SSH_HOST" \
            "deploy-web $GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT"
