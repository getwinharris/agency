name: App

on:
  pull_request:
    paths: ['gui/**', 'skills/**', 'starters/app-admin/**', '.github/workflows/app.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: gui/.nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.5'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: gui/package.json
          cache: true
          cache_dependency_path: gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck --filter=@cloudroom/app --filter=@cloudroom/server --filter=@cloudroom/desktop --concurrency=2
      - name: Tests
        run: pnpm exec turbo run test --filter=@cloudroom/config --concurrency=2
      - name: CLI, Tools, and installer regression checks
        run: >-
          pnpm exec vitest run --maxWorkers=2
          apps/cli/src/__tests__/command-output
          apps/cli/src/__tests__/room-cli.e2e.test.ts
          apps/cli/src/__tests__/startup-graph.test.ts
          apps/desktop/test/room-cli-shim.test.ts
          apps/host-daemon/test/room-cli-launchers.test.ts
          apps/server/test/app/host-artifact.test.ts
          apps/server/test/app/install-machine-script.test.ts
          apps/server/test/services/plugins/plugin-cli.test.ts
          apps/server/test/skills/shipped-skills-quality.test.ts
          apps/server/test/public/public-project-skills.test.ts
          apps/server/test/threads/thread-runtime-config.test.ts
          apps/app/src/components/tools/detail-page-recipes.test.tsx
          apps/app/src/components/plugin/PluginSidebarFooterItems.test.tsx
          apps/app/src/views/LibraryView.test.tsx
          apps/app/src/components/secondary-panel/ThreadSecondaryPanelTabContent.markdown-images.test.tsx
          packages/plugin-sdk/src/internal/command-guard.test.ts
          packages/scripts/test/run-cli.test.ts
      - name: Workspace Automations navigation checks
        run: |
          pnpm --filter bb-plugin-automations run test navigation.test.tsx
          pnpm --filter @cloudroom/app exec vitest run --config vitest.config.ts --maxWorkers=2 src/components/layout/AppLayout.tools-breadcrumbs.test.ts src/views/thread-detail/SplitThreadArea.test.tsx
      - name: Computer Use browser guidance checks
        run: pnpm --filter bb-plugin-computer-use run test server.test.ts
      - name: App starter tests
        working-directory: starters/app-admin
        run: |
          npm ci --ignore-scripts
          npm test
