worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }

http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=1s ipv6=off;
    client_max_body_size 40k;
    client_header_timeout 8s;
    client_body_timeout 8s;
    limit_req_status 429;

    map $http_cookie $app_session {
        default "";
        "~(?:^|;\s*)__Host-bapx-app-session=[^;]*(?:;\s*[^;]*)*;\s*__Host-bapx-app-session=" "";
        "~(?:^|;\s*)(?<session_pair>__Host-bapx-app-session=[A-Za-z0-9_-]{43})(?:;|$)" $session_pair;
    }
    map $request_method $sample_rate_key {
        default $host;
        GET "";
        HEAD "";
    }
    limit_req_zone $sample_rate_key zone=sample_writes:1m rate=30r/m;

    server {
        listen 8080 default_server;
        return 404;
    }
    server {
        listen 8080;
        server_name dynamic-check.app.bapx.in;
        add_header X-Robots-Tag noindex always;

        location / {
            limit_req zone=sample_writes burst=12 nodelay;
            set $backend http://app:3000;
            proxy_pass $backend;
            proxy_connect_timeout 2s;
            proxy_read_timeout 12s;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Cookie $app_session;
        }
    }
}
