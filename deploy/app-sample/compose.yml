services:
  app:
    image: ${BAPX_SAMPLE_IMAGE:?Set the verified sample image}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      APP_ID: dynamic-check
      APP_NAME: bapX Node sample
      APP_BIND_ADDRESS: 0.0.0.0
      APP_ORIGIN: https://dynamic-check.example.test
      APP_DATA_DIR: /private
      APP_OWNER_EMAIL: owner@example.test
      APP_OWNER_PASSWORD_FILE: /run/secrets/owner-password
    volumes:
      - data:/private
      - type: bind
        source: ${BAPX_SAMPLE_OWNER_FILE:?Set the disposable owner password file}
        target: /run/secrets/owner-password
        read_only: true
        bind:
          create_host_path: false
    labels:
      traefik.enable: "false"
    networks: [private]

  edge:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    configs:
      - source: nginx
        target: /nginx.conf
    entrypoint: [nginx, -c, /nginx.conf, -g, daemon off;]
    networks: [private, ingress]
    labels:
      traefik.enable: "false"

volumes:
  data:

configs:
  nginx:
    file: ./nginx.conf

networks:
  private:
    internal: true
  ingress: {}
