worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 64; }

http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=1s ipv6=off;

    map $http_cookie $app_session {
        default "";
        "~(?:^|;\s*)(?<session_pair>__Host-bapx-app-session=[A-Za-z0-9_-]{43})(?:;|$)" $session_pair;
    }
    map $http_cookie $app_email {
        default "";
        "~(?:^|;\s*)(?<email_pair>__Host-bapx-app-email=[A-Za-z0-9_-]{43})(?:;|$)" $email_pair;
    }

    ssl_certificate /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    server {
        listen 8443 ssl default_server;
        return 404;
    }
    server {
        listen 8443 ssl;
        server_name dynamic-check.example.test;
        location / {
            set $backend http://app:3000;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Cookie "$app_session; $app_email";
            proxy_set_header Authorization "";
            proxy_set_header Proxy-Authorization "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
        }
    }
}
